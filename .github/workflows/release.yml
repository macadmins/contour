name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run builds and uploads the archives as workflow artifacts and
  # creates no release; only a tag push publishes.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CONTOUR_SCHEMA_ZIP_BASE: ${{ secrets.CONTOUR_SCHEMA_ZIP_BASE }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            machine: x86-64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            machine: ARM aarch64

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Extract version from tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            # Manual run: the version the tree declares.
            echo "version=$(grep -m1 '^version = ' crates/contour/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set SOURCE_DATE_EPOCH
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          release_epoch="$(git log -1 --format=%ct "$RELEASE_REF")"
          echo "SOURCE_DATE_EPOCH=$release_epoch" >> "$GITHUB_ENV"

      # Two products, as on macOS: contour-mcp is read-only and ships on
      # its own, so it gets its own archive rather than riding in contour's.
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p contour -p contour-mcp

      - name: Strip binaries
        run: strip target/${{ matrix.target }}/release/contour target/${{ matrix.target }}/release/contour-mcp

      - name: Verify release binaries
        env:
          TARGET_DIR: target/${{ matrix.target }}/release
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          for bin in contour contour-mcp; do
            file "$TARGET_DIR/$bin" | tee binary-type.txt
            grep -Fq "$EXPECTED_MACHINE" binary-type.txt
            "$TARGET_DIR/$bin" --version
          done
          # The datasets are compiled in; census reads them back out of the
          # binary. A zero count means a crate shipped without its data.
          "$TARGET_DIR/contour" census --json | tee census.json
          ! grep -E '"[a-z_]+": 0(,|$)' census.json

      - name: Package binaries
        env:
          TARGET_DIR: target/${{ matrix.target }}/release
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          for bin in contour contour-mcp; do
            cp "$TARGET_DIR/$bin" dist/
            tar -C dist -czf "dist/$bin-$VERSION-$TARGET.tar.gz" "$bin"
          done
          cd dist
          sha256sum -- *.tar.gz > "checksums-$TARGET.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: contour-${{ matrix.target }}
          path: dist/*.tar.gz

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ matrix.target }}
          path: dist/checksums-${{ matrix.target }}.txt

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Combine checksums
        run: |
          # Named for the platform: the macOS workflow publishes its own
          # manifest to the same release.
          sort artifacts/checksums-*/checksums-*.txt > checksums-linux.txt
          # two binaries on two targets
          test "$(wc -l < checksums-linux.txt)" -eq 4

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: Contour ${{ github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/checksums-*/checksums-*.txt
            checksums-linux.txt
          generate_release_notes: true
