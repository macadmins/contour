name: Verify locked TLS dependencies

on:
  pull_request:
    paths: [Cargo.toml, Cargo.lock, 'crates/**/Cargo.toml', .github/workflows/tls-dependencies.yml]
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, 'crates/**/Cargo.toml', .github/workflows/tls-dependencies.yml]

permissions:
  contents: read

jobs:
  tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Resolve the committed graph without changing it
        run: cargo tree --locked -p mscp -i rustls-webpki
      - name: Reject pre-mitigation TLS dependencies
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          for name, minimum in (("rustls-webpki", (0, 103, 16)), ("webpki-root-certs", (1, 0, 10))):
              versions = [p["version"] for p in packages if p["name"] == name]
              assert versions, f"Missing {name}; review the new TLS graph"
              for version in versions:
                  assert tuple(map(int, version.split("."))) >= minimum, (name, version)
                  print(name, version)
          PY
