# Disable Apple Intelligence on macOS.
#
# DDM bundle that flips every Apple Intelligence toggle to false in
# `com.apple.configuration.intelligence.settings` plus the per-app
# toggles under Apps (Mail, Notes, Safari, Calendar). Apple's defaults
# are all `true`, so this declaration has to set each one explicitly.
#
# Compose with:
#   contour profile ddm compose \
#       crates/profile/recipes/ddm/disable-apple-intelligence-macos.toml \
#       -o ./declarations/disable-apple-intelligence-macos
#
# Output: configuration.json (the declaration) + activation.json
# (a simple activation that targets it). The activation has no
# predicate — scope it via your MDM's group/team assignment.
#
# Schema source: Apple device-management
# (declaration-configuration-intelligence.settings.yaml).
# Verified against contour's embedded schema:
# `contour profile info com.apple.configuration.intelligence.settings --full`.

intent_name = "disable-apple-intelligence-macos"
# Compose refuses any key Apple does not offer on this platform.
platforms = ["macOS"]

[configuration]
type = "com.apple.configuration.intelligence.settings"

  [configuration.payload]
  # Top-level Apple Intelligence toggles. Default: true.
  AllowAppleIntelligenceReport = false
  AllowGenmoji = false
  AllowImagePlayground = false
  AllowVisualIntelligence = false              # 27.0+
  AllowWritingTools = false
  # Not set here: AllowImageWand, AllowPersonalizedHandwritingResults and
  # AllowVisualIntelligenceSummary: Apple's schema does not offer them on
  # macOS.

  # Per-app controls live under `Apps`, not at the payload root: Apple
  # ignores a `Mail` or `Notes` key placed beside the top-level toggles.
  # Default: true.
  [configuration.payload.Apps.Mail]
  AllowSmartReplies = false
  AllowSummary = false

  [configuration.payload.Apps.Notes]
  AllowTranscription = false
  AllowTranscriptionSummary = false

  [configuration.payload.Apps.Safari]
  AllowSummary = false

  [configuration.payload.Apps.Calendar]        # introduced in 27.0
  AllowNaturalLanguageEditing = false

[activation]
# Simple activation, no predicate. Target by Fleet team / MDM group.
type = "com.apple.activation.simple"
