# Microsoft Entra ID Platform SSO for macOS — Password method.
#
# Variant of `entra-psso.toml` for fleets that need **password sync**
# at the login window: the local account password is kept in sync with
# the user's Entra ID password.
#
# Password sync — of any kind — REQUIRES
# `PlatformSSO.AuthenticationMethod = "Password"`. The Secure Enclave
# method (`UserSecureEnclaveKey`, see entra-psso.toml) is passwordless
# by design: there is no credential to sync. This is an Apple/Microsoft
# platform constraint, not an MDM limitation.
#
# `AppPrefixAllowList` ships with the vendor-neutral core
# (com.microsoft.,com.apple.). Jamf-managed fleets can extend it — see
# the commented value below.
#
# URLs cover the worldwide commercial cloud. For sovereign clouds also
# add: login.partner.microsoftonline.cn, login.chinacloudapi.cn,
# login.microsoftonline.us, login-us.microsoftonline.com.
#
# References:
#   - Configure Platform SSO for macOS:
#     https://learn.microsoft.com/intune/device-configuration/settings-catalog/configure-platform-sso-macos
#   - Fleet issue #44867 — pSSO with Entra at the login window:
#     https://github.com/fleetdm/fleet/issues/44867

[recipe]
name = "entra-psso-password"
description = "Microsoft Entra ID Platform SSO for macOS (Password sync)"
vendor = "Microsoft"

[[profile]]
filename = "entra-psso-password.mobileconfig"
payload_type = "com.apple.extensiblesso"
display_name = "Platform SSO – Entra ID (Password)"
description = "Configures Microsoft Entra ID SSO Extension with Platform SSO using the Password method, enabling login-window password sync"
removal_disallowed = true

[profile.fields]
Type = "Redirect"
TeamIdentifier = "UBF8T346G9"
ExtensionIdentifier = "com.microsoft.CompanyPortalMac.ssoextension"
URLs = ["https://login.microsoftonline.com", "https://login.microsoft.com", "https://sts.windows.net"]
ScreenLockedBehavior = "DoNotHandle"

[profile.extra_fields]
# Password method — the OS keeps a credential it can write back to the
# local account, which is what makes login-window password sync work.
# `UserSecureEnclaveKey` is passwordless and cannot sync (entra-psso.toml).
"PlatformSSO.AuthenticationMethod" = "Password"
"PlatformSSO.UseSharedDeviceKeys" = true
# Register Platform SSO during Setup Assistant so the credential exists
# before the user first reaches the login window.
"PlatformSSO.EnableRegistrationDuringSetup" = true
# Account mapping. The value is the IdP token claim used to name the local
# account, and it is the key most likely to produce a profile that installs
# cleanly and then behaves wrongly: Apple types AccountName as a free-form
# string, so nothing validates it.
#
# This value is the one observed working in a production Entra fleet.
# `preferred_username` shipped here previously — a standard OIDC claim
# carrying the full UPN — and produced a profile that installed cleanly
# without working. Edit this line if your tenant's claim mapping differs.
#
# Apple documents TokenToUserMapping only as "the attribute mapping to use
# when creating users, or for authorization" and does not enumerate values,
# so verify against your own tenant before a fleet-wide rollout.
"PlatformSSO.TokenToUserMapping.AccountName" = "com.apple.PlatformSSO.AccountShortName"
"PlatformSSO.TokenToUserMapping.FullName" = "name"
# Device registration. RegistrationToken is the MDM-supplied token that
# drives PSSO device registration; without it the profile installs and
# registration never runs. The value is MDM-specific — Intune uses
# {{DEVICEREGISTRATION}}, other MDMs substitute their own variable — so it
# ships as a placeholder you must replace.
"RegistrationToken" = "{{PSSO_REGISTRATION_TOKEN}}"
# Shown to the user in the sign-in UI.
"PlatformSSO.AccountDisplayName" = "{{PSSO_ACCOUNT_DISPLAY_NAME}}"
"PlatformSSO.AllowDeviceIdentifiersInAttestation" = true
"PlatformSSO.SynchronizeProfilePicture" = true
# Optional — group-driven local admin rights. Auth-method-independent,
# so they work with the Password method too. Org-specific, shipped
# commented out (uncomment to map Entra groups to macOS authorization):
#   "PlatformSSO.EnableAuthorization" = true
#   "PlatformSSO.NewUserAuthorizationMode" = "Standard"
#   "PlatformSSO.UserAuthorizationMode" = "Standard"
# ExtensionData app-allowlist keys (Microsoft's recommended defaults):
"ExtensionData.AppPrefixAllowList" = "com.microsoft.,com.apple."
"ExtensionData.browser_sso_interaction_enabled" = 1
"ExtensionData.disable_explicit_app_prompt" = 1
