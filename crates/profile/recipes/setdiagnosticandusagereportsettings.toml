# Diagnostic & usage reporting settings.
#
# DEPRECATION NOTE: the second profile uses com.apple.applicationaccess,
# which Apple deprecated as of macOS 26 — it still applies on macOS 25
# and earlier but stops working on macOS 26+. The partial DDM
# replacement is com.apple.configuration.screentime. The SubmitDiagInfo
# profile is unaffected.

[recipe]
name = "setdiagnosticandusagereportsettings"
description = "Set Diagnostic & Usage reporting settings — disable automatic diagnostic submission"

[[profile]]
filename = "SubmitDiagInfo.mobileconfig"
payload_type = "com.apple.SubmitDiagInfo"
display_name = "Security & Privacy"
description = ""
removal_disallowed = false

[profile.fields]
AutoSubmit = false

[profile.extra_fields]

[[profile]]
filename = "applicationaccess.mobileconfig"
payload_type = "com.apple.applicationaccess"
display_name = "Security & Privacy"
description = ""
removal_disallowed = false

[profile.fields]
allowDiagnosticSubmission = false

[profile.extra_fields]
