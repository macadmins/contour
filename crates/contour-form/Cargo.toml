[package]
name = "contour-form"
version = "0.5.0-beta.1"
description = "Apple/Windows MDM schema registry and form contract, with no filesystem in the default-features-off build"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["native", "cli"]
# Directory readers, file writers and the clock. Everything that names
# `std::fs` or takes the current time lives behind this. A build with
# `--no-default-features` is the purity gate: it must link for
# wasm32-unknown-unknown.
native = ["dep:chrono"]
# `clap::ValueEnum` on `Channel`, for the CLI crates.
cli = ["dep:clap"]

[dependencies]
mdm-schema.workspace = true
mscp-schema.workspace = true
windows-schema.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
plist.workspace = true
yaml_serde.workspace = true
sha2.workspace = true
base64.workspace = true
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
