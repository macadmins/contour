[package]
name = "contour-form-wasm"
version = "0.5.0-beta.2"
description = "wasm-bindgen face of contour-form: FormSpec out, documents back, over JSON strings"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Default features off: this is the build that must not name the filesystem.
contour-form = { path = "../contour-form", version = "0.5.0-beta.2", default-features = false }
serde_json.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
